apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: repo-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
    spec:
      containers:
      - name: query
        image: repo-intel/query:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: repo-intel-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: repo-intelligence
spec:
  selector:
    app: query-service
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
