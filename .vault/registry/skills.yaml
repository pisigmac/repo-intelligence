version: '1.0'
skills:
- id: new-person
  name: Create Person Note
  description: Generate a structured person file from context
  version: 1.0.0
  inputs:
  - name: name
    type: string
    required: true
  - name: role
    type: string
    required: false
  outputs:
  - type: file
    path_template: people/{slug}.md
    schema: person
  permissions:
    read:
    - templates/person.md
    write:
    - people/
  providers:
  - all
  sandbox:
    network: false
    filesystem: restricted
    timeout: 30s
- id: archive-stale
  name: Archive Stale Content
  description: Move files older than threshold to .vault/archive
  version: 1.0.0
  inputs:
  - name: threshold_days
    type: integer
    default: 120
  outputs:
  - type: report
    path: .vault/index/archive-report.yaml
  permissions:
    read:
    - projects/
    - people/
    - threads/
    - experiments/
    - meetings/
    write:
    - .vault/archive/
    - .vault/index/
  schedule: 0 2 * * 0
  providers:
  - all
